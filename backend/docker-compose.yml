services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: transverse
      POSTGRES_USER: transverse
      POSTGRES_PASSWORD: transverse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro  # auto-run migrations on first start
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://transverse:transverse@db:5432/transverse
      PORT: "8080"
      TOPICS_GRAPH_PATH: /app/data/topics.json
      ONNX_MODEL_PATH: /app/models/bge-small-en-v1.5.onnx
      CACHE_ENABLED: "true"
      BYPASS_AUTH: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data:ro
      - ./models:/app/models:ro

volumes:
  pgdata:
