openapi: 3.1.0
info:
  title: Transverse API
  version: 1.1.0
  description: Transverse Backend API for Next.js UI Integration with Local Judge0 Sandbox, Problem Scraping, and Dynamic Progressive Roadmap Engine.
servers:
  - url: /api/v1
    description: Transverse Base API Path
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    JobAcceptedResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
    TestCase:
      type: object
      properties:
        input:
          type: string
        output:
          type: string
    ProblemPayload:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
        url:
          type: string
        slug:
          type: string
        topic:
          type: string
        difficulty_label:
          type: string
          enum: [easy, medium, hard]
        glicko_rating:
          type: number
        solve_rate:
          type: number
        status:
          type: string
          enum: [SOLVED, UNSOLVED, ATTEMPTED]
        statement:
          type: string
        test_cases:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        templates:
          type: object
          additionalProperties:
            type: string
          description: Map of starter code templates keyed by language slug (py, cpp, java, js, go, rust, c, kt)
    TestCaseResult:
      type: object
      properties:
        test_case_index:
          type: integer
        input:
          type: string
        expected_output:
          type: string
        actual_stdout:
          type: string
        stderr:
          type: string
        compile_output:
          type: string
        status_id:
          type: integer
        status_desc:
          type: string
        time_ms:
          type: integer
        memory_kb:
          type: integer
        passed:
          type: boolean
    BatchExecuteRequest:
      type: object
      required:
        - language_id
        - source_code
      properties:
        language_id:
          type: integer
          description: Judge0 language ID (e.g. 71 for Python, 54 for C++, 62 for Java, 63 for JavaScript, 60 for Go, 73 for Rust, 50 for C, 78 for Kotlin)
        source_code:
          type: string
        problem_id:
          type: string
        test_cases:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
    BatchExecuteResponse:
      type: object
      properties:
        all_passed:
          type: boolean
        passed_count:
          type: integer
        total_count:
          type: integer
        overall_status:
          type: string
        overall_status_id:
          type: integer
        max_time_ms:
          type: integer
        max_memory_kb:
          type: integer
        test_cases:
          type: array
          items:
            $ref: '#/components/schemas/TestCaseResult'
    Tutorial:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        source_url:
          type: string
        title:
          type: string
        topic_id:
          type: string
        topic_tags:
          type: array
          items:
            type: string
        type:
          type: string
          enum: [article, video, interactive, playlist]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        estimated_minutes:
          type: integer
        summary:
          type: string
        thumbnail_url:
          type: string
        status:
          type: string
          enum: [UNREAD, COMPLETED]
    RoadmapSubsection:
      type: object
      properties:
        node_id:
          type: string
          format: uuid
        topic_id:
          type: string
        title:
          type: string
        sequence:
          type: integer
        status:
          type: string
          enum: [locked, unlocked, in_progress, mastered, tested_out]
        user_rating:
          type: number
        target_rating:
          type: number
        mastery_score:
          type: number
          description: Normalized 0-100% mastery score
        tutorials:
          type: array
          items:
            $ref: '#/components/schemas/Tutorial'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ProblemPayload'
    RoadmapSection:
      type: object
      properties:
        phase_id:
          type: string
          format: uuid
        sequence:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [ACTIVE, COMPLETED, LOCKED]
        progress_percentage:
          type: number
        subsections:
          type: array
          items:
            $ref: '#/components/schemas/RoadmapSubsection'
    UpcomingSectionPreview:
      type: object
      properties:
        sequence:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [LOCKED]
    RoadmapCurrentResponse:
      type: object
      properties:
        roadmap_id:
          type: string
          format: uuid
        user_id:
          type: string
        user_rating:
          type: number
        target_role:
          type: string
        status:
          type: string
          enum: [active, completed, abandoned]
        total_sections:
          type: integer
        current_section:
          $ref: '#/components/schemas/RoadmapSection'
        upcoming_sections:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingSectionPreview'
    ScrapedProblemResponse:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        source:
          type: string
        url:
          type: string
        difficulty:
          type: string
        statement:
          type: string
        input_spec:
          type: string
        output_spec:
          type: string
        time_limit:
          type: string
        memory_limit:
          type: string
        test_cases:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        templates:
          type: object
          additionalProperties:
            type: string

security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                username:
                  type: string
      responses:
        '201':
          description: User registered and authenticated
  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User authenticated
  /auth/oauth/{provider}/redirect:
    get:
      tags:
        - Auth
      summary: OAuth Redirect
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github]
      responses:
        '302':
          description: Redirect to OAuth provider
  /auth/oauth/{provider}/callback:
    get:
      tags:
        - Auth
      summary: OAuth Callback
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [github]
      responses:
        '200':
          description: OK
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh token
      responses:
        '200':
          description: Tokens refreshed
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout and revoke token
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      tags:
        - Auth
      summary: Authenticated identity summary
      responses:
        '200':
          description: OK

  /roadmap:
    get:
      tags:
        - Dynamic Progressive Roadmap
      summary: Fetch dynamic roadmap on frontend load (Single Active Section + Upcoming Locked Previews)
      description: Re-evaluates progression and returns full details (tutorials, questions, starter code templates, ratings, status) only for the single current active section. Subsequent sections are locked until the active section is completed.
      responses:
        '200':
          description: Current dynamic roadmap state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapCurrentResponse'
  /roadmap/me:
    get:
      tags:
        - Dynamic Progressive Roadmap
      summary: Alias for GET /roadmap
      responses:
        '200':
          description: Current dynamic roadmap state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapCurrentResponse'
  /roadmap/nodes/{id}/complete:
    post:
      tags:
        - Dynamic Progressive Roadmap
      summary: Mark a roadmap subsection / tutorial as mastered
      description: Triggers unlock re-evaluation. If all nodes in the current section are completed, automatically advances to and unlocks the next progressive section.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /roadmap/nodes/{id}/test-out:
    post:
      tags:
        - Dynamic Progressive Roadmap
      summary: Test-out bypass for a roadmap subsection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /roadmap/generate:
    post:
      tags:
        - Dynamic Progressive Roadmap
      summary: Generate or regenerate personalized roadmap
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target_role:
                  type: string
                confirmed_hypotheses:
                  type: array
                  items:
                    type: string
                debunked_hypotheses:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Newly generated roadmap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapCurrentResponse'

  /execute:
    post:
      tags:
        - Code Execution
      summary: Submit single test case to local Judge0 instance
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language_id:
                  type: integer
                source_code:
                  type: string
                stdin:
                  type: string
                expected_output:
                  type: string
      responses:
        '200':
          description: Execution verdict
  /execute/batch:
    post:
      tags:
        - Code Execution
      summary: Multi-test-case execution (Runs code against all problem test cases individually)
      description: Iterates through each test case against local Judge0. Stops early on compilation error. Aggregates results, pass/fail counts, max time, max memory, and per-test-case stdout/stderr.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchExecuteRequest'
      responses:
        '200':
          description: Aggregated batch execution verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExecuteResponse'
  /execute/{token}:
    get:
      tags:
        - Code Execution
      summary: Get Judge0 execution verdict by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verdict details

  /problems/scrape:
    post:
      tags:
        - Problem Scraping
      summary: Scrape problem statement, test cases, and starter templates from URL
      description: Scrapes LeetCode (GraphQL), Codeforces (HTML), or generic CP platforms. Extracts problem statement HTML, sample input/output test cases, and automatically generates 8-language starter templates.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  example: "https://leetcode.com/problems/two-sum/"
      responses:
        '200':
          description: Scraped problem details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapedProblemResponse'
  /problems/search:
    get:
      tags:
        - Problems
      summary: Search problem repository
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: topic
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching problems with statements, test cases, and templates

  /practice/start:
    post:
      tags:
        - Practice
      summary: Start adaptive practice session
      responses:
        '200':
          description: Practice session initialized
  /practice/submit:
    post:
      tags:
        - Practice
      summary: Submit problem answer and update Glicko-2 ability rating
      responses:
        '200':
          description: Answer evaluation and next problem
  /practice/skip:
    post:
      tags:
        - Practice
      summary: Skip problem
      responses:
        '200':
          description: Skipped
  /practice/close:
    post:
      tags:
        - Practice
      summary: Close session and calculate learning DNA
      responses:
        '200':
          description: Closed session metrics
  /practice/session/{id}:
    get:
      tags:
        - Practice
      summary: Practice session detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session state
  /practice/{sessionId}/hint:
    post:
      tags:
        - Practice
      summary: Request LLM hint
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Hint job accepted
  /practice/{sessionId}/error-analysis:
    get:
      tags:
        - Practice
      summary: Latest LLM error analysis
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analysis

  /events/stream:
    get:
      tags:
        - Realtime
      summary: SSE stream of realtime user events (node unlocked, section unlocked, hint generated)
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /health:
    get:
      tags:
        - Health
      summary: Health and database liveness check
      security: []
      responses:
        '200':
          description: Healthy
