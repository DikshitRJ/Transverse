services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: transverse
      POSTGRES_USER: transverse
      POSTGRES_PASSWORD: transverse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_USER=transverse
      - POSTGRES_PASSWORD=transverse
      - POSTGRES_DB=transverse
    volumes:
      - ./backend/judge0.conf:/judge0.conf:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true
    command: ["./scripts/workers"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_USER=transverse
      - POSTGRES_PASSWORD=transverse
      - POSTGRES_DB=transverse
    volumes:
      - ./backend/judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-server:
        condition: service_started

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  init-data:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://transverse:transverse@db:5432/transverse
      TOPICS_GRAPH_PATH: /app/data/topics.json
    volumes:
      - ./data:/app/data:ro
    command: >
      sh -c "
      echo 'Starting Problem Seeding...' &&
      /app/seed_pipeline --skip-embed &&
      echo 'Starting Tutorial Ingestion...' &&
      /app/ingest_pipeline -mode tutorial -file /app/data/tutorial.json &&
      echo 'Initialization complete!'
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      init-data:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://transverse:transverse@db:5432/transverse
      PORT: "8080"
      TOPICS_GRAPH_PATH: /app/data/topics.json
      CACHE_ENABLED: "true"
      BYPASS_AUTH: "true"
      REDIS_ADDR: "redis:6379"
      JUDGE0_BASE_URL: "http://judge0-server:2358"
      JUDGE0_API_KEY: ""
      FRONTEND_ORIGIN: "http://localhost:3000"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password123"
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: "evidence"
      JWT_SECRET: "transverse-deterministic-secret-key-32-chars"
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: "https://api.z.ai/api/paas/v4"
      ZAI_MODEL: "glm-4.7-flash"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: live
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_URL: http://backend:8080
      NODE_ENV: production
      PORT: "3000"
    ports: ["3000:3000"]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-eyJhIjoiMDU0MGY3OWU4MmVmMWQxMDU5M2I1MmZjMDVkOGExZDEiLCJ0IjoiNDNiYzY4MDEtZjJlNi00MjAwLThlYTctMTdjZGY2NmU1NmUyIiwicyI6Ik1EY3dZVGsxTmpBdE1qVTVPQzAwTnpaaExUZzJaV0V0WVdFNVlUZzRZell3WWpReSJ9}
    depends_on:
      frontend:
        condition: service_started

volumes:
  pgdata:
  miniodata: